# Risk scoring policy — the floors, caps and tiers applied AFTER the model
# returns. Data, not prompt text, so a threshold change is a diff here plus a
# policy_version bump, and history can be re-scored without another API call.
#
# Read by backend/utils/ai/policy.py. Every value is on the 0-1 scale the rest
# of the system uses (risk_snapshot.score); the model's 0-100 integers are
# converted back to 0-1 in langchain_llm before policy ever sees them.
#
# Bump policy_version whenever any threshold below changes.

policy_version: "p1.0"
effective_from: "2026-07-26"
notes:
  - "Floors and caps applied AFTER the model returns. Raw scores are preserved."
  - "Scales are 0-1, matching risk_snapshot.score."
  - "Floors raise both horizons; the political-stability cap lowers one subscore."

# Sustained interstate war or regular long-range strikes on cities/critical
# infrastructure. The most severe non-legal condition.
war_on_territory:
  conflict_war_floor: 0.90
  overall_floor: 0.90

# Escalating internal-conflict levels. Highest applicable floor wins (C > B > A).
internal_conflict:
  A: {conflict_war_floor: 0.80, overall_floor: 0.70}
  B: {conflict_war_floor: 0.88, overall_floor: 0.80}
  C: {overall_floor: 0.90}

# Routine political turbulence (cabinet resignations, caretaker phases,
# coalition talks, snap elections) stays moderate. The cap lifts only when the
# situation is genuinely a rupture, which is what these two flags mark.
political_stability_cap:
  value: 0.45
  released_by: [emergency_rule, sovereign_stress]

# Read from the macro payload, not from the model's opinion of it — the CPI
# number is already in the evidence. Restructured from a bare list into
# indicator + tiers so the mapping stays valid YAML.
inflation_floors:
  indicator: "Inflation (% y/y)"   # the pretty name in constants.NICE_NAME
  tiers:                           # evaluated high-to-low; first match wins
    - {at_or_above: 80, overall_floor: 0.80}
    - {at_or_above: 40, overall_floor: 0.65, macro_vol_floor: 0.80}
    - {at_or_above: 25, overall_floor: 0.55, macro_vol_floor: 0.70}
