# ---------------------------------------------------------------------------
# MOVED OUT: the time-varying three
# ---------------------------------------------------------------------------
# These belong in the payload and do NOT belong in this file, because they move
# every year and a 2016 snapshot must see 2016's value:
#
#   GOV.DEBT.FX.SHARE        share of government debt denominated in foreign
#                            currency, % of total
#   GOV.DEBT.DOMESTIC.SHARE  share of government debt held by residents,
#                            % of total
#   NIIP.GDP                 net international investment position, % of GDP
#
# They are registered in `constants.INDICATOR_REGISTRY` and load through
# `backend/data/curated.csv`, whose `as_of` column carries the vintage — so they
# inherit the no-future bound for free, with no new machinery.
#
# They are currently ABSENT, and that is the honest state rather than an
# oversight. Debt composition by currency and by holder is published per country
# by national debt agencies and inside IMF Article IV staff reports, mostly as
# PDF tables; there is no free machine-readable series covering the roster.
# Estimating them would be exactly the fabrication this file refuses. Add rows to
# curated.csv as they are sourced — one row per country-year with its own as_of,
# and the loader validates the rest.
