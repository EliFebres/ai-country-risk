# Currency regime per country — the input that lets `suppressed_vol_flag` tell a
# credible calm currency from a defended one. See README.md section 1.
#
# Regime is one of: peg | managed | float
# Collapse the IMF AREAER de-facto categories onto those three:
#   no separate legal tender, currency board, conventional peg  -> peg
#   stabilized, crawling peg/band, pegged within bands, other managed -> managed
#   floating, free floating                                     -> float
#
# Ships empty on purpose. An unlisted country reads as "regime unknown", and
# `suppressed_vol_flag` returns None rather than False — "we have no regime file"
# and "this is a free float" are different facts.
#
# Bump `version` and update `as_of` whenever you edit the entries.

version: 1
as_of: null
source: "IMF AREAER"
regimes: {}
  # PT: float
  # SA: peg
  # CN: managed
