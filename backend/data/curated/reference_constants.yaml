# Frozen reference levels. Scalars that must not drift between runs.
#
# `rome_reference_ratio` is the reference for `metrics.rome_gap`: the typical
# ratio of (top statutory rate) to (tax revenue % GDP). Compute it ONCE from a
# filled `statutory_rates.csv` — the median across the roster is the intended
# construction — then write it here and leave it alone.
#
# It is deliberately not recomputed each run. A live roster median would make a
# country's own gap history move whenever its peers' data moved, so the same
# country-year would report two different gaps on two days its own numbers never
# changed. Freezing it is what makes the series comparable over time.
#
# `rome_gap` reports its raw ratio with or without this value; only the `gap`
# field stays null until it is set.
#
# Bump `version` when you recompute. Never edit the number in place without
# bumping — a stored gap whose reference silently changed is unauditable.

version: 1
rome_reference_ratio: null
computed_from: null   # e.g. "statutory_rates.csv @ 2026-07-27, 38 countries, median"
